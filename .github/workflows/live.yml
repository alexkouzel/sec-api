name: Live EDGAR check

# Daily: runs the library against live EDGAR. When it fails, EDGAR has probably changed a
# format the library reads; this opens an issue (or comments on the open one) so you hear
# about it. See "When the live check fails" in CLAUDE.md.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run live tests
        env:
          # "Name contact@domain", as EDGAR requires; set under Settings > Secrets.
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        # EDGAR is sometimes down for a while; one retry later avoids false alarms.
        run: ./gradlew liveTest || (sleep 600 && ./gradlew liveTest)

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: live-test-report
          path: build/reports/tests/liveTest/

      - name: Open or update the issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create edgar-change --color D93F0B --description "The live EDGAR check failed" --force
          number=$(gh issue list --label edgar-change --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "Still failing: $RUN_URL"
          else
            gh issue create --label edgar-change --title "Live EDGAR check failed" \
              --body "The library failed against live EDGAR: $RUN_URL. The failed tests name the URL of each response that broke; see \"When the live check fails\" in CLAUDE.md."
          fi
