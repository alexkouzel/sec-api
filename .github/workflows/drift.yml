name: EDGAR drift check

# Weekly: samples live EDGAR and the SEC spec page, and opens or updates one issue
# labelled spec-drift when anything differs from the model. Never closes it.
on:
  schedule:
    - cron: '0 6 * * 2' # Tuesdays, so the daily list covers Monday
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: drift-check

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: Run drift check
        id: check
        continue-on-error: true
        env:
          # "Name contact@domain", as EDGAR requires; set under Settings > Secrets.
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
        run: ./gradlew :legacy:driftCheck

      - name: Upload report and raw responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-report
          path: legacy/build/drift/
          if-no-files-found: ignore

      - name: Open or update the spec-drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          count=$(cat legacy/build/drift/findings-count 2>/dev/null || true)
          if [ -z "$count" ]; then
            echo "::error::The drift check wrote no report; see the 'Run drift check' step."
            exit 1
          fi
          cat legacy/build/drift/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" = 0 ]; then
            echo "No drift found."
            exit 0
          fi

          { cat legacy/build/drift/issue.md; printf '\nRun: %s\n' "$RUN_URL"; } > issue-body.md
          gh label create spec-drift --color D93F0B \
            --description "EDGAR data or specs differ from the model" --force
          number=$(gh issue list --label spec-drift --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue-body.md
            gh issue comment "$number" --body "Drift check found $count findings again: $RUN_URL"
          else
            gh issue create --title "EDGAR drift detected" --label spec-drift --body-file issue-body.md
          fi
          echo "::warning::$count drift findings; see the spec-drift issue."
