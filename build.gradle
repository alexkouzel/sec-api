plugins {
    id 'java'
    id 'io.freefair.lombok' version '9.8.2'
    id 'maven-publish'
}

group = 'com.alexkouzel'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Test tags:
//   live       — hits real EDGAR; run with ./gradlew liveTest
//   known-bug  — documents a bug from docs/ROADMAP.md and fails until it's fixed;
//                run with ./gradlew knownBugTest, drop the tag once the fix lands
test {
    useJUnitPlatform {
        excludeTags 'live', 'known-bug'
    }
}

tasks.register('liveTest', Test) {
    description = 'Runs smoke tests against live EDGAR.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    outputs.upToDateWhen { false }
}

tasks.register('knownBugTest', Test) {
    description = 'Runs tests that document known, unfixed bugs.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'known-bug'
    }
    outputs.upToDateWhen { false }
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/alexkouzel/sec-api")
            credentials {
                username = project.findProperty("gpr.username") ?: System.getenv("GPR_USERNAME")
                password = project.findProperty("gpr.token") ?: System.getenv("GPR_TOKEN")
            }
        }
    }
}
