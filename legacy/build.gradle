plugins {
    id 'java'
    id 'io.freefair.lombok' version '9.8.2'
    id 'maven-publish'
}

// The Java library, kept building until the Kotlin rewrite in lib/ replaces it (Phase 5).
group = 'com.alexkouzel'
base.archivesName = 'sec-api'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'com.fasterxml.jackson.dataformat:jackson-dataformat-xml:2.15.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.15.2'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.15.2'
    testImplementation platform('org.junit:junit-bom:6.1.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The EDGAR fixtures moved to lib's test fixtures; the Java tests still read them.
sourceSets.test.resources.srcDir '../lib/src/testFixtures/resources'

// Test tags:
//   live       — hits real EDGAR; run with ./gradlew liveTest
//   known-bug  — documents a bug from docs/ROADMAP.md and fails until it's fixed;
//                run with ./gradlew knownBugTest, drop the tag once the fix lands
//   drift      — samples live EDGAR and reports differences from the model;
//                run with ./gradlew driftCheck, report in build/drift/
test {
    useJUnitPlatform {
        excludeTags 'live', 'known-bug', 'drift'
    }
}

tasks.register('liveTest', Test) {
    description = 'Runs smoke tests against live EDGAR.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    outputs.upToDateWhen { false }
}

tasks.register('knownBugTest', Test) {
    description = 'Runs tests that document known, unfixed bugs.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'known-bug'
    }
    outputs.upToDateWhen { false }
}

tasks.register('driftCheck', Test) {
    description = 'Checks live EDGAR data and spec versions against the model; writes build/drift/report.md.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'drift'
    }
    def driftDir = layout.buildDirectory.dir('drift')
    systemProperty 'drift.dir', driftDir.get().asFile.path
    doFirst { delete driftDir }
    outputs.upToDateWhen { false }
}

tasks.withType(Test).configureEach {
    testLogging {
        events 'failed', 'skipped'
        exceptionFormat = 'full'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'sec-api'
            from components.java
        }
    }
    repositories {
        maven {
            name = "GitHubPackages"
            url = uri("https://maven.pkg.github.com/alexkouzel/sec-api")
            credentials {
                username = project.findProperty("gpr.username") ?: System.getenv("GPR_USERNAME")
                password = project.findProperty("gpr.token") ?: System.getenv("GPR_TOKEN")
            }
        }
    }
}
